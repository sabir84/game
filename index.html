    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        function isExtensionError(msg, file, stack) {
          var s = String(msg || '') + ' ' + String(file || '') + ' ' + String(stack || '');
          return (
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1 ||
            s.indexOf('Failed to connect to MetaMask') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (e) {
            var stack = e.error && e.error.stack ? e.error.stack : '';
            if (isExtensionError(e.message, e.filename, stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e.reason;
            var msg = r && r.message ? r.message : r;
            var stack = r && r.stack ? r.stack : '';
            if (isExtensionError(msg, '', stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
